name: Compilar para Windows

# Define cuándo se ejecutará este flujo de trabajo
on:
  push:
    branches: [ "main", "master" ] # Se ejecuta al hacer push a la rama principal
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build-windows:
    # Utiliza un runner de Windows para poder generar el .exe nativo
    runs-on: windows-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      # 2. Configurar Python en el entorno
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Puedes cambiar la versión si lo necesitas (ej: 3.11, 3.12)
          cache: 'pip' # Cachea las dependencias para acelerar futuras compilaciones

      # 3. Instalar dependencias necesarias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Instala las librerías de tu proyecto si existe requirements.txt
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      # 4. Ejecutar PyInstaller para crear el ejecutable
      - name: Compilar con PyInstaller
        run: |
          # --onefile: Crea un solo archivo .exe (en lugar de una carpeta)
          # --noconsole: Opcional. Úsalo si tu App tiene interfaz gráfica (GUI) y no quieres que se abra una ventana negra de comandos atrás.
          # Si tu App es de consola, quita --noconsole.
          pyinstaller --onefile --noconsole SuiteAnalisisDatos.py

      # 5. Subir el archivo compilado como un "Artefacto" de GitHub
      # Esto permite descargarlo después de que termine la ejecución.
      - name: Subir ejecutable final
        uses: actions/upload-artifact@v4
        with:
          name: SuiteDataAnalisis-Windows-Exe # Nombre del paquete de descarga
          path: dist/SuiteDataAnalisis.exe # Ruta donde PyInstaller guarda el .exe
          retention-days: 5 # Tiempo que guardará el archivo antes de borrarlo
